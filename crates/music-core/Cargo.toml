[package]
name = "music-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
sha2 = "0.10"
fs2 = "0.4"
mailparse = "0.16"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rustfft = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }

[dev-dependencies]
tempfile = "3"
