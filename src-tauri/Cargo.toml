[package]
name = "music-generator"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local music generation desktop app"

[lib]
name = "music_generator"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "rt-multi-thread", "macros"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
futures-util = "0.3"
mailparse = "0.16"
sysinfo = "0.33"
fs2 = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
semver = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
